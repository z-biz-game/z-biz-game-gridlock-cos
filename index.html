<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="description" content="死锁车库：把主角车开出停车场。每一关的最少步数都是广度优先搜索量出来的。">
<link rel="icon" href="data:,">
<title>死锁车库 · GRIDLOCK</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand"><span class="brand-mark">▩</span>死锁车库<small>GRIDLOCK</small></h1>
  <nav class="modes" id="modes" aria-label="模式">
    <button type="button" data-mode="campaign">战役</button>
    <button type="button" data-mode="daily">每日</button>
    <button type="button" data-mode="random">随机</button>
  </nav>
  <p class="totals" id="totals"></p>
</header>

<main class="stage">
  <section class="board">
    <canvas id="lot" aria-label="停车场平面图"></canvas>
    <p class="hint-line" id="hintline"></p>
    <div class="curtain" id="curtain" hidden>
      <div class="curtain-card">
        <p class="stars" id="stars"></p>
        <h2 id="verdict"></h2>
        <p class="tally" id="tally"></p>
        <div class="curtain-actions">
          <button type="button" id="again">再来一次</button>
          <button type="button" id="next" class="primary">下一关</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <p class="crumbs" id="crumbs"></p>
    <dl class="readout" id="readout"></dl>
    <div class="controls">
      <button type="button" id="undo">撤销</button>
      <button type="button" id="hint">提示</button>
      <button type="button" id="restart">重开</button>
      <button type="button" id="share">分享</button>
    </div>
    <div class="shelf" id="shelf"></div>
    <details class="about">
      <summary>这一关的数字从哪来</summary>
      <p>每一关的最少步数都由 <code>js/core/solve.js</code> 的广度优先搜索量出：一次拖动不论滑过几格都算一步。关卡来自 <code>tools/bake.mjs</code>——它在构建期跑生成器 <code>js/core/make.js</code>，只收下搜索能复现的那些，浏览器本身不做生成。</p>
      <p class="save">成绩只存在这台设备的浏览器里。<button type="button" id="wipe">清空存档</button></p>
    </details>
  </aside>
</main>

<p class="toast" id="toast" hidden></p>
<script type="module" src="js/main.js"></script>
</body>
</html>
